# IndustrialVision AI — production edge.
# Included inside nginx's http{} block (conf.d/*.conf). TLS terminates here;
# the backend only receives plain HTTP on the internal Docker network.
# Certificates are mounted at /etc/nginx/tls (see docs/deployment-tls.md).

# Access log omits the query string: WebSocket and other requests must never
# store tokens in logs. `log_format` may be declared here (http context) but the
# `access_log` directive itself is already set by the base nginx.conf, so it is
# applied per-server below instead of being redeclared at http level.
log_format iv_redacted '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent rt=$request_time';

# Per-client limits: login brute-force budget, general API budget, WS connections.
limit_req_zone $binary_remote_addr zone=iv_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=iv_api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=iv_ws:10m;

server_tokens off;

server {
    listen 8080;
    server_name _;
    access_log /var/log/nginx/access.log iv_redacted;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    access_log /var/log/nginx/access.log iv_redacted;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin only: fonts are bundled by Vite, the build has no inline
    # scripts, and the API and WebSocket live on this origin.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    client_max_body_size 110m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Login gets a strict per-IP budget against password guessing.
    location = /api/v1/auth/login {
        limit_req zone=iv_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000/auth/login;
        include /etc/nginx/conf.d/iv-proxy-headers.inc;
    }

    location /api/v1/ {
        limit_req zone=iv_api burst=60 nodelay;
        proxy_pass http://backend:8000/;
        include /etc/nginx/conf.d/iv-proxy-headers.inc;
    }

    location /api/ {
        limit_req zone=iv_api burst=60 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/iv-proxy-headers.inc;
    }

    # JWT travels in Sec-WebSocket-Protocol, never in the URL.
    location /ws/ {
        limit_conn iv_ws 20;
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/conf.d/iv-proxy-headers.inc;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
