services:
  postgres:
    image: postgres:18-alpine
    container_name: industrialvision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-industrialvision}
      POSTGRES_USER: ${POSTGRES_USER:-iv_user}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD environment variable must be set}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Security: No public port exposed. Only reachable within internal bridge network
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iv_user} -d ${POSTGRES_DB:-industrialvision}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: industrialvision-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    # Event bus fan-out + worker queue only; no persistence by design (events
    # are transient) and no public port. No secrets stored.
    networks:
      - internal-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    # redis runs as its own unprivileged user in the official image; drop
    # capabilities it does not need.
    cap_drop:
      - ALL
    tmpfs:
      - /data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: industrialvision-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: 8000
      JWT_SECRET: "${JWT_SECRET:?Error: JWT_SECRET environment variable must be set (minimum 32 characters)}"
      DATABASE_URL: postgresql://${POSTGRES_USER:-iv_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-industrialvision}
      REDIS_URL: redis://redis:6379/0
      TASK_QUEUE_MODE: rq
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost:8443}
      EVIDENCE_ROOT: /app/data/evidence
      MODEL_ROOT: /app/models
      # Fabricated demo inspections are refused in production (config validator enforces this).
      DEMO_LIVE_FEED: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TRUST_PROXY_HEADERS: "true"
    volumes:
      - evidence_data:/app/data/evidence
      - model_data:/app/models
    networks:
      - internal-net
      - frontend-net
    ports:
      # Internal API direct access if needed, or bound to localhost
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: industrialvision-worker
    restart: unless-stopped
    # Same image as the backend; consumes the RQ queue with the same task
    # functions (video inspection today, RAG ingestion as modules land).
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      DEBUG: "false"
      JWT_SECRET: "${JWT_SECRET:?Error: JWT_SECRET environment variable must be set (minimum 32 characters)}"
      DATABASE_URL: postgresql://${POSTGRES_USER:-iv_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-industrialvision}
      REDIS_URL: redis://redis:6379/0
      TASK_QUEUE_MODE: rq
      EVIDENCE_ROOT: /app/data/evidence
      MODEL_ROOT: /app/models
      DEMO_LIVE_FEED: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - evidence_data:/app/data/evidence
      - model_data:/app/models
    networks:
      - internal-net
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: industrialvision-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend-net
    volumes:
      # Operator-provided certificate and key (see docs/deployment-tls.md).
      - ${TLS_CERT_DIR:-./deploy/tls}:/etc/nginx/tls:ro
    ports:
      # HTTPS is the only public entry point; HTTP on 8080 only redirects.
      - "${PUBLIC_HTTPS_PORT:-8443}:8443"
      - "${PUBLIC_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://127.0.0.1:8443/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Runtime hardening that is safe for the unprivileged nginx image.
    # NOTE: `read_only: true` is deliberately NOT set here: the nginx entrypoint
    # scripts may write under /etc/nginx, which would break container startup.
    # Enable it only after verifying `docker compose up` on your own host.
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  prometheus:
    image: prom/prometheus:v3.7.2
    container_name: industrialvision-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - internal-net
    ports:
      # Operator access only; never exposed publicly (metrics are internal).
      - "127.0.0.1:9090:9090"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  grafana:
    image: grafana/grafana:12.2.0
    container_name: industrialvision-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Provisioned dashboards/datasource are read-only; admin password required.
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Error: GRAFANA_ADMIN_PASSWORD environment variable must be set}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - internal-net
    ports:
      # Operator access only (127.0.0.1); put a TLS proxy in front for remote use.
      - "127.0.0.1:3001:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    user: "472:472"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres_data:
    name: industrialvision_postgres_data
  evidence_data:
    name: industrialvision_evidence_data
  model_data:
    name: industrialvision_model_data
  prometheus_data:
    name: industrialvision_prometheus_data
  grafana_data:
    name: industrialvision_grafana_data

networks:
  internal-net:
    internal: true
    driver: bridge
  frontend-net:
    driver: bridge
