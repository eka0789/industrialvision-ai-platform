[alembic]
# Paths are resolved relative to the directory that contains this ini file,
# so `alembic upgrade head` works both from backend/ (per README) and from
# /app inside the container.
script_location = %(here)s/migrations
version_locations = %(here)s/migrations/versions
prepend_sys_path = %(here)s
path_separator = os
file_template = %%(year)d%%(month)d%%(day)d%%(hour)d%%(minute)d%%(second)d

sqlalchemy.url = sqlite:///industrialvision.db

[loggers]
keys = root, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = DEBUG
handlers = console
propagate = 0
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s


