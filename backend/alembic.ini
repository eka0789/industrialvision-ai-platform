[alembic]
script_location = backend/migrations
version_locations = backend/migrations/versions
prepend_sys_path = .
file_template = %%(year)d%%(month)d%%(day)d%%(hour)d%%(minute)d%%(second)d
sync_table_list = None
tinge = brown

sqlalchemy.url = sqlite:///industrialvision.db

[loggers]
keys = root, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = DEBUG
handlers = console
propagate = 0
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s


